name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  web:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Validate release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_REF'] == f'v{version}', 'Run the release workflow on a version tag matching Cargo.toml'
          PY
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 3
  binaries:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p staging dist
          cp "target/$TARGET/release/meowradio$EXTENSION" staging/
          cp README.md LICENSE .env.example staging/
          cp -r web/dist/licenses staging/licenses
          python - <<'PY'
          import os, shutil
          target = os.environ['TARGET']
          shutil.make_archive(f'dist/meowradio-{target}', 'zip' if os.environ['EXTENSION'] else 'gztar', 'staging')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
  docker:
    needs: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/ca-x/meowradio:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
  publish:
    needs: [binaries, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum meowradio-* > SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create -t "ghcr.io/ca-x/meowradio:$TAG" "ghcr.io/ca-x/meowradio:$TAG-amd64" "ghcr.io/ca-x/meowradio:$TAG-arm64"
          if [[ "$TAG" != *-* ]]; then
            docker buildx imagetools create -t ghcr.io/ca-x/meowradio:latest "ghcr.io/ca-x/meowradio:$TAG"
          fi
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
