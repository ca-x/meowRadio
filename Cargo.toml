[package]
name = "meowradio"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A self-hosted radio receiver with personal presets"
repository = "https://github.com/ca-x/meowRadio"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
webpki-roots = "1"
futures-util = "0.3"
ipnet = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime_guess = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
radiobrowser = { version = "0.6.1", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tempfile = "3"
tower-http = { version = "0.6", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Upstream 0.6.1 API with reqwest/Hickory security dependency updates.
radiobrowser = { path = "vendor/radiobrowser" }
