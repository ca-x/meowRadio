[package]
name = "meowradio"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A self-hosted radio receiver with personal presets"
repository = "https://github.com/ca-x/meowRadio"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
futures-util = "0.3"
ipnet = "2"
mime_guess = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
radiobrowser = { version = "0.6.1", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Upstream 0.6.1 API with reqwest/Hickory security dependency updates.
radiobrowser = { path = "vendor/radiobrowser" }
